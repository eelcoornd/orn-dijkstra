<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "en" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; max-width: 42rem; margin: 4rem auto; padding: 0 1rem; line-height: 1.6; }
    header a { text-decoration: none; font-weight: 600; }
    nav a { margin-right: 1rem; }
    footer { margin-top: 4rem; font-size: .85rem; opacity: .7; }
  </style>
</head>
<body>
  <header>
    <a href="{{ "/" | relURL }}">{{ .Site.Title }}</a>
    <nav>{{ range .Site.Menus.main }}<a href="{{ .URL }}">{{ .Name }}</a>{{ end }}</nav>
  </header>
  <main>
    {{ block "main" . }}{{ .Content }}{{ end }}
  </main>
  <footer>© {{ now.Year }} Orn-Dijkstra · Built with Hugo</footer>
</body>
</html>
